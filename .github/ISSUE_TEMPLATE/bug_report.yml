name: Bug report
description: Something in the mod does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please do **not** attach game files: only logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
  - type: input
    id: version
    attributes:
      label: Mod version
      description: "The release number shown on the Remastered page or in the log's first line."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "Windows version, or Linux distribution / Steam Deck and the Proton version."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: "Attach `mods/remastered-mod.log` from the game folder (in co-op, every player's). Before attaching, open it and remove your user name and home folder paths."
