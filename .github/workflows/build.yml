# Builds the mod (and the test-only mods) for every push and pull request, and keeps the release zip as an artifact.
name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm   # Debian's mingw-w64 (GCC 12): the same tools as every release, so builds are reproducible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the build tools
        run: tools/ci-setup.sh
      - name: Build
        run: ./build.sh --tests
      - name: Package
        run: |
          git config --global --add safe.directory "$PWD"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) tools/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-zip
          path: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
