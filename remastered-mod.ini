; Insaniquarium - Remastered Mod settings (mods/remastered-mod.ini). Changes apply the next time the game starts.

[core]
; 0 = mods off (as holding Shift while the game starts, but every time)
enabled=1

[display]
; native (the default) = a normal window as large as the screen allows (the largest whole multiple of 640x480 that fits,
; with the taskbar), resizable and maximisable; the game scaled up inside it. borderless = a borderless window covering
; the screen, black bars at the sides. normal = the game's own 640x480 window (or its fullscreen mode, chosen in its
; Options). native and borderless switch the game to windowed mode (if it was fullscreen, it restarts itself once)
window=native
; fit = as large as fits; integer = the largest whole multiple (2x, 3x...: sharpest pixels, wider bars)
scale=fit

[screensaver]
; F11 on the main menu starts the game's screensaver (your Virtual Tank); 0 = no key. Also: the Mods page's Open button
key=122
; 1 = the game closes while the screensaver shows (they share your profile); 0 = it keeps running
quit=1

[timecontrol]
; keys as Windows virtual-key codes: 116 = F5, 117 = F6, 119 = F8 (others: 80 = P, 32 = Space)
pause=116
slow=117
fast=119

[autosave]
; save the level in progress and the profile every N minutes (0 = only when the game pauses) and whenever it pauses
minutes=2
; the small "Autosaved" note
label=1

[continues]
; when all fish die: spend shells for two guppies and keep going (price rises by this much with each continue)
enabled=1
price=500

[fps]
; frame counter: key 114 = F3; shown=1 to start with it on
key=114
shown=0

[screenshot]
; 123 = F12; saved to the game folder's screenshots\ folder
key=123

[accessibility]
; a red "!" over hungry fish; each coin's value under it
hungry=1
coins=1

[mutators]
; rule changes for Adventure, Time Trial and Challenge levels (not the Virtual Tank): 1 = on, from the next level
; fish get hungry twice as fast
hungry=0
; every alien arrives with a twin
double=0
; your laser hits twice as hard, but aliens are faster
glass=0
; no pets come into the tank
nopets=0
; your laser can't hurt aliens (pets and food only)
pacifist=0
; coins sink faster
heavycoins=0
; you can't hold more than $2,500
tinywallet=0
; start each level with $1,000
richstart=0
; prices and alien health +50%, aliens sooner, hungrier fish
hard=0
; 1 in 50 guppies you buy is golden: coins twice as often
golden=0
; quick coin pickups build a bonus of up to double value
combos=0
; feeding frenzies, power cuts and currents now and then
events=0
; feeding a full fish stuffs it (no coins for a while); three times and it pops
overeat=0
; dead fish float until you click them away, and make the others hungry
decay=0
; buy an auto-feeder, a coin magnet and an alien alarm in each tank (panel top left)
gadgets=0

[achievements]
; a banner when an achievement unlocks
banners=1

[coop]
; the port the host listens on (TCP); the name shown to the others (empty = your profile's name)
port=27615
name=
; your avatar on your pointer (0 none, 1 guppy, 2-31 the pets and special fish; the lobby's Avatar button changes it)
avatar=1
; co-op over Steam: the steam_api.dll in use when there's none in mods\coop (found in your Steam libraries and filled in
; by the mod; empty = search again)
steam_api=
; online co-op: the server (the co-op screen's Online tab, Server settings, changes these). Empty server_host = the
; mod's public server (insanicoop.mychud.net). Your own server (docs/SERVER.md): its name or address, port, TLS (1 =
; https, for the internet; 0 = plain http, for your own network, usually port 7350) and its server key (not a password:
; every player of that server has it)
server_host=
server_port=443
server_tls=1
key=
; this computer's anonymous login on the server (made on first use)
device=
